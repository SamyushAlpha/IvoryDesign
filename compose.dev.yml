# Explicit local development only. Never use this override for AWS deployment.
# !override requires Docker Compose 2.24.4+ (included in current Docker Desktop).
services:
  web:
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - type: bind
        source: .
        target: /app
    ports: !override
      - "127.0.0.1:${IVORY_DEV_PORT:-8000}:8000"
      - "192.168.1.64:${IVORY_DEV_PORT:-8000}:8000"
  worker:
    volumes:
      - type: bind
        source: .
        target: /app
  beat:
    volumes:
      - type: bind
        source: .
        target: /app
