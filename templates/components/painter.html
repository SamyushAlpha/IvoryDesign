<g class="scene-painter" data-entry="{{ entry }}" data-target-x="{{ x }}" data-target-y="{{ y }}" style="--painter-colour: {{ colour }}" opacity="0">

            <stop stop-color="#b4bca6"/><stop offset=".35" stop-color="{{ colour }}"/><stop offset="1" stop-color="#40584e"/>

        <linearGradient id="skin-{{ entry }}" x1="0" y1="0" x2="1" y2=".65">

            <stop stop-color="#fff8e7"/><stop offset="1" stop-color="#c7c5b3"/>
        </linearGradient>
        <linearGradient id="helmet-{{ entry }}" x1="0" y1="0" x2=".8" y2="1">
