<div class="hero-drawing" aria-hidden="true">
    <svg class="house-sketch" viewBox="0 0 820 640" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse class="scene-ground-shadow" cx="415" cy="606" rx="276" ry="18" fill="#07110f" opacity=".34"/>
        <g data-interior-scene="loft">
            {% include 'components/interior_drawing.html' %}
            {% include 'components/interior_paint.html' %}
        </g>
        <g data-interior-scene="residence" style="display:none">
            {% include 'components/residence_drawing.html' %}
            {% include 'components/residence_paint.html' %}
        </g>
        <g data-interior-scene="apartment" data-ground-offset="54" transform="translate(0 54)" style="display:none">
            {% include 'components/apartment_drawing.html' %}
            {% include 'components/apartment_paint.html' %}
        </g>
        <g class="drawing-pencil" opacity="0">
            <g transform="rotate(32) scale(.4)">
                {% include 'components/drawing_pencil.html' %}
            </g>
        </g>
        <g class="painter-vehicles">
            {% include 'components/painter_vehicle.html' with entry="left" kind="loader" %}
            {% include 'components/painter_vehicle.html' with entry="right" kind="excavator" %}
            {% include 'components/painter_vehicle.html' with entry="bottom" kind="truck" %}
        </g>
        <g class="painter-team">
            {% include 'components/painter.html' with entry="left" x="187" y="484" colour="#b69159" %}
            {% include 'components/painter.html' with entry="bottom" x="367" y="558" colour="#b69159" %}
            {% include 'components/painter.html' with entry="right" x="650" y="480" colour="#b69159" %}
        </g>
        <g class="paint-sparkles" opacity="0" stroke="#ffdf57" stroke-width="2" stroke-linecap="round">
            <path d="M142 264V242 M131 253H153 M717 246V224 M706 235H728 M495 88V70 M486 79H504"/>
        </g>
    </svg>
</div>
